<!doctype html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- ملفات CSS المحلية -->
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/font-awesome.min.css" />
    <link rel="stylesheet" href="css/toastr.min.css" />
    <!-- تنسيق WowSlider -->
    <link rel="stylesheet" href="css/wowslider.css" />
    <!-- تنسيق الموقع -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
    <title>Document</title>
  </head>
  <body>
    <main class="login-wrapper">
      <div class="login-card">
        <div class="header-section text-center mb-4">
          <h2 class="h4 fw-bold">تسجيل الدخول</h2>
          <p class="text-muted small">أهلاً بك مجدداً! أدخل بياناتك للوصول</p>
        </div>
        <form id="loginForm" novalidate>
          <!-- حقل البريد الإلكتروني -->
          <div class="email-group mb-3">
            <label for="loginEmail" class="form-label small">البريد الإلكتروني <span class="text-danger">*</span></label>
            <div class="input-group">
              <input type="email" id="loginEmail" class="form-control" placeholder="example@domain.com" required />
              <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
            </div>
            <div class="error-text text-danger small mt-1 d-none" id="emailError">يرجى إدخال بريد إلكتروني صالح</div>
          </div>


      </div>

    </main>
    
  </body>
</html>
